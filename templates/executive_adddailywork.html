{% extends "executive_base.html" %}
{% block title %} Executive New Work{% endblock %}

{% block content %}

<style>

.page-container {
    background: #0f172a;
    padding: 20px;
    border-radius: 12px;
    color: #fff;
}


.page-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 20px;
}

.assign-btn {
    background: #7c3aed;
    border: none;
    padding: 8px 15px;
    border-radius: 6px;
    color: white;
    font-size: 14px;
}

.search-box {
    width: 100%;
    padding: 8px;
    margin-bottom: 15px;
    border-radius: 6px;
    border: none;
    background-color: #1e293b;
    color: white;
}

.table-container {
    overflow-x: auto;
}

.custom-table {
    width: 100%;
    border-collapse: collapse;
}

.custom-table th {
    text-align: left;
    font-size: 13px;
    color: #94a3b8;
    padding: 10px;
    border-bottom: 1px solid #1e293b;
}

.custom-table td {
    padding: 12px 10px;
    border-bottom: 1px solid #1e293b;
    font-size: 14px;
}

.progress-bar-bg {
    background: #1e293b;
    border-radius: 5px;
    height: 6px;
    width: 100px;
}

.progress-bar-fill {
    background: #3b82f6;
    height: 100%;
    border-radius: 5px;
}
.allocate-btn {
    border: 1px solid #3b82f6;
    background: transparent;
    color: #3b82f6;
    padding: 5px 10px;
    border-radius: 5px;
    font-size: 12px;
}
.complete-btn {
    border: 1px solid green;
    background: transparent;
    color: green;
    padding: 5px 10px;
    border-radius: 5px;
    font-size: 12px;
}
.status-dotred {
    width: 12px;
    height: 12px;
    background: #ef4444;
    border-radius: 50%;
    display: block;          
    margin: 0;               
    flex-shrink: 0;         
    cursor: pointer;
    transition: transform 0.2s;
}

.status-dotred:hover {
    transform: scale(1.3);
    background: #dc2626;
}
.not-allocated-btn {
    display: inline-block;
    padding: 5px 12px;
    background: yellow; 
    color: black;
    border-radius: 6px;
    font-size: 12px;
    cursor: default; 
    transition: background 0.3s;
}

.not-allocated-btn:hover {
    background: black;
    color: yellow; 
}
.breadcrumb-item a {
    position: relative;
    z-index: 5;  
    cursor: pointer;
    text-decoration: underline;
    color: #2563eb; 
}


.team-lead-row {
    display: flex;
    align-items: center;      
    justify-content: flex-start;
    gap: 6px;
    margin-bottom: 6px;
}
.main-content::before {
    pointer-events: none;
}
.form-control {
    background-color:#1e293b !important;   /* Black background */
    color: #fff !important;              /* White text */
    border: 1px solid #374151;           /* Soft border */
}

.form-control:focus {
    background-color: #0f172a !important;
    color: #fff !important;
    border-color: #3b82f6;               /* Blue highlight */
    box-shadow: none;
}

/* For file input */
input[type="file"] {
    background-color: #1e293b !important;
    color: #fff !important;
}

/* Placeholder color */
::placeholder {
    color: #9ca3af !important;
}




</style>
{% if messages %}
    <div class="row mb-4">
        <div class="col-12">
            {% for message in messages %}
            <div class="alert alert-{{ message.tags }} alert-dismissible fade show" role="alert">
                {{ message }}
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>
            {% endfor %}
        </div>
    </div>
    {% endif %}


<nav aria-label="breadcrumb">
    <ol class="breadcrumb breadcrumb-custom bg-transparent p-0 mb-3">
        <li class="breadcrumb-item">
            <a href="{% url 'executive_work_home' %}" class="text-secondary fw-bold" style="text-decoration: none">Works</a>
        </li>
         <li class="breadcrumb-item active text-secondary" aria-current="page">
             <a href="{% url 'executive_task_ongoing' %}" class="text-secondary fw-bold" style="text-decoration: none"> Ongoing Works</a>
        </li>
        <li class="breadcrumb-item active text-secondary" aria-current="page">
            Add Daily Works
        </li>
    </ol>
</nav>
<div class="page-container">

<h5 class="mb-3">Add Daily Works</h5>

<form method="POST" enctype="multipart/form-data">
{% csrf_token %}

<input type="hidden" name="task_id" value="{{ Task.task.id }}">
<input type="hidden" name="work_id" value="{{ Task.id }}">

<!-- Task Name -->
<div class="mb-3">
  <label>Task Name</label>
  <input type="text" class="form-control" 
         value="{{ Task.task.task_name }}" readonly>
</div>

<!-- Date -->
<div class="mb-3">
  <label>Date</label>
  <input type="date" name="work_date" 
         class="form-control" 
         value="{{ today|date:'Y-m-d' }}" readonly>
</div>

<!-- Title -->
<div class="mb-3">
  <label>Title</label>
  <input type="text" name="title" class="form-control">
</div>

<!-- Description -->
<div class="mb-3">
  <label>Daily Works</label>
  <textarea name="description" class="form-control"></textarea>
</div>

<!-- Target -->
<div class="mb-3">
  <label>Target</label>
  <input type="number" name="target" class="form-control">
</div>

<!-- File Upload -->
<div class="mb-3">
  <label>Upload File</label>
  <input type="file" name="file" class="form-control">
</div>

<!-- Submit -->
<button type="submit" class="btn btn-primary">Save</button>

</form>

</div>
    </div>
  </div>
</div>








{% endblock %}
